<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farix · ChatGPT</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true">F</div>
        <div class="brand-text">
          <p class="brand-name">Farix</p>
          <p class="brand-sub">ChatGPT session</p>
        </div>
        <span id="header-dot" class="dot idle" title="Session status"></span>
      </header>

      <!-- Logged out -->
      <section id="login-view" class="view">
        <div class="intro">
          <h1>Welcome back</h1>
          <p>Sign in to launch your managed ChatGPT session.</p>
        </div>
        <form id="login-form" class="form">
          <label>
            Email
            <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required />
          </label>
          <label>
            Password
            <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
          </label>
          <button id="login-button" class="btn primary" type="submit">Sign in</button>
        </form>
      </section>

      <!-- Logged in -->
      <section id="app-view" class="view hidden">
        <div class="card user-card">
          <span class="label">Signed in as</span>
          <p id="user-email" class="value">—</p>
        </div>

        <div class="card session-card">
          <div class="session-row">
            <div>
              <span class="label">Active profile</span>
              <p id="session-copy" class="value">No session injected</p>
            </div>
            <span id="session-status" class="pill idle">Inactive</span>
          </div>
          <p id="expiry-line" class="muted">Access until —</p>
        </div>

        <button id="inject-button" class="btn primary" type="button">Inject Session</button>
        <button id="clear-button" class="btn ghost" type="button">Clear Session</button>

        <p id="error-message" class="error hidden" role="alert"></p>
        <button id="logout-button" class="link" type="button">Log out</button>
      </section>

      <footer>Unlimited ChatGPT access until your plan expires</footer>
    </main>
    <script src="config.js"></script>
    <script src="supabase.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
