<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farix · Multi</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true">F</div>
        <div class="brand-text">
          <p class="brand-name">Farix</p>
          <p class="brand-sub">Veo 3 + ChatGPT</p>
        </div>
        <button id="theme-button" class="icon-btn" type="button" title="Toggle theme">◐</button>
        <span id="header-dot" class="dot idle" title="Session status"></span>
      </header>

      <!-- Logged out -->
      <section id="login-view" class="view">
        <div class="intro">
          <h1>Welcome back</h1>
          <p>Sign in to launch your managed Farix session.</p>
        </div>
        <form id="login-form" class="form">
          <label>
            Email
            <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required />
          </label>
          <label>
            Password
            <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
          </label>
          <button id="login-button" class="btn primary" type="submit">Sign in</button>
        </form>
        <p id="login-error" class="error hidden" role="alert"></p>
      </section>

      <!-- Logged in -->
      <section id="app-view" class="view hidden">
        <div class="card user-card">
          <div>
            <span class="label">Signed in as</span>
            <p id="user-email" class="value">—</p>
          </div>
          <span id="plan-pill" class="pill plan">—</span>
        </div>

        <div class="card">
          <span class="label">Tool access</span>
          <ul id="tool-list" class="tools"></ul>
          <p id="expiry-line" class="muted">Access until —</p>
        </div>

        <div id="selector-wrap" class="selector hidden">
          <button class="seg" data-tool="veo" type="button">Veo 3</button>
          <button class="seg" data-tool="chatgpt" type="button">ChatGPT</button>
        </div>

        <button id="inject-button" class="btn primary" type="button">Inject Session</button>
        <button id="clear-button" class="btn ghost" type="button">Clear Data</button>

        <p id="error-message" class="error hidden" role="alert"></p>
        <button id="logout-button" class="link" type="button">Log out</button>
      </section>

      <footer>Unlimited access until your plan expires</footer>
    </main>
    <script src="config.js"></script>
    <script src="supabase.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
